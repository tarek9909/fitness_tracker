services:
  # ----------------------------------------------------------------------------
  # Database Service: Authoritative MySQL 8.x
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: fitness-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD:?DATABASE_ROOT_PASSWORD is required in production}
      MYSQL_DATABASE: ${DATABASE_NAME:-fitness_platform}
      MYSQL_USER: ${DATABASE_USER:-fitness_user}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required in production}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend_net

  # ----------------------------------------------------------------------------
  # Migration Service: One-Shot Schema Migration Runner (Pre-Start Gate)
  # ----------------------------------------------------------------------------
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fitness-migrate
    restart: "no"
    command: ["node", "dist/database/migrate.js"]
    healthcheck:
      disable: true
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./fitness_tracker.db:/app/fitness_tracker.db:ro
    environment:
      NODE_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 3000
      TRUST_PROXY: "true"
      DB_CLIENT: mysql
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: ${DATABASE_NAME:-fitness_platform}
      DATABASE_USER: ${DATABASE_USER:-fitness_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required in production}
      DATABASE_POOL_MIN: ${DATABASE_POOL_MIN:-2}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?ACCESS_TOKEN_SECRET must be at least 32 characters}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?REFRESH_TOKEN_SECRET must be at least 32 characters}
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET must be at least 32 characters}
      EMAIL_PROVIDER: smtp
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required when EMAIL_PROVIDER=smtp}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:?SMTP_USER is required when EMAIL_PROVIDER=smtp}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD is required when EMAIL_PROVIDER=smtp}
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM is required when EMAIL_PROVIDER=smtp}
      PASSWORD_RESET_BASE_URL: ${PASSWORD_RESET_BASE_URL:?PASSWORD_RESET_BASE_URL must be a valid https URL in production}
      ADMIN_ALLOWED_ORIGINS: ${ADMIN_ALLOWED_ORIGINS:?ADMIN_ALLOWED_ORIGINS must be configured with HTTPS origins in production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks:
      - backend_net

  # ----------------------------------------------------------------------------
  # API Service: Node.js / Fastify Core Authoritative Server
  # ----------------------------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fitness-api
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./fitness_tracker.db:/app/fitness_tracker.db:ro
    environment:
      NODE_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 3000
      TRUST_PROXY: "true"
      DB_CLIENT: mysql
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: ${DATABASE_NAME:-fitness_platform}
      DATABASE_USER: ${DATABASE_USER:-fitness_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required in production}
      DATABASE_POOL_MIN: ${DATABASE_POOL_MIN:-5}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-20}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?ACCESS_TOKEN_SECRET must be at least 32 characters}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?REFRESH_TOKEN_SECRET must be at least 32 characters}
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET must be at least 32 characters}
      EMAIL_PROVIDER: smtp
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required when EMAIL_PROVIDER=smtp}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:?SMTP_USER is required when EMAIL_PROVIDER=smtp}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD is required when EMAIL_PROVIDER=smtp}
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM is required when EMAIL_PROVIDER=smtp}
      PASSWORD_RESET_BASE_URL: ${PASSWORD_RESET_BASE_URL:?PASSWORD_RESET_BASE_URL must be a valid https URL in production}
      ADMIN_ALLOWED_ORIGINS: ${ADMIN_ALLOWED_ORIGINS:?ADMIN_ALLOWED_ORIGINS must be configured with HTTPS origins in production}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:' + (process.env.APP_PORT || 3000) + '/api/v1/health/ready').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - backend_net
      - frontend_net

  # ----------------------------------------------------------------------------
  # Worker Service: Background Reminder Daemon (Isolated Process)
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fitness-reminder-worker
    restart: always
    command: ["node", "dist/workers/reminder.worker.js"]
    healthcheck:
      disable: true
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    volumes:
      - ./fitness_tracker.db:/app/fitness_tracker.db:ro
    environment:
      NODE_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 3000
      TRUST_PROXY: "true"
      DB_CLIENT: mysql
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: ${DATABASE_NAME:-fitness_platform}
      DATABASE_USER: ${DATABASE_USER:-fitness_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required in production}
      DATABASE_POOL_MIN: ${DATABASE_POOL_MIN:-2}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?ACCESS_TOKEN_SECRET must be at least 32 characters}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?REFRESH_TOKEN_SECRET must be at least 32 characters}
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET must be at least 32 characters}
      EMAIL_PROVIDER: smtp
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required when EMAIL_PROVIDER=smtp}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:?SMTP_USER is required when EMAIL_PROVIDER=smtp}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD is required when EMAIL_PROVIDER=smtp}
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM is required when EMAIL_PROVIDER=smtp}
      PASSWORD_RESET_BASE_URL: ${PASSWORD_RESET_BASE_URL:?PASSWORD_RESET_BASE_URL must be a valid https URL in production}
      ADMIN_ALLOWED_ORIGINS: ${ADMIN_ALLOWED_ORIGINS:?ADMIN_ALLOWED_ORIGINS must be configured with HTTPS origins in production}
      REMINDER_WORKER_INTERVAL_SECONDS: ${REMINDER_WORKER_INTERVAL_SECONDS:-30}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks:
      - backend_net

  # ----------------------------------------------------------------------------
  # Dashboard Service: Nginx React Admin SPA
  # ----------------------------------------------------------------------------
  dashboard:
    build:
      context: ./admin-dashboard
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.fitnessplatform.com/api/v1}
    container_name: fitness-admin-dashboard
    restart: always
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${DASHBOARD_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - frontend_net

# ------------------------------------------------------------------------------
# Network Topologies
# ------------------------------------------------------------------------------
networks:
  backend_net:
    driver: bridge
    internal: true
  frontend_net:
    driver: bridge

# ------------------------------------------------------------------------------
# Volumes
# ------------------------------------------------------------------------------
volumes:
  mysql_data:
    driver: local
