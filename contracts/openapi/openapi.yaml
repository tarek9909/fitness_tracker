openapi: 3.1.0
info:
  title: Fitness Tracking Platform API
  version: 1.0.0
  description: Authoritative REST API for multi-user fitness management, daily tracking, workout/diet plan builders, progress analysis, reminders, and administration.
servers:
  - url: http://localhost:4000/api/v1
    description: Local Development Server

paths:
  /health:
    get:
      summary: Health check
      tags: [System]
      responses:
        '200':
          description: System status and database connectivity
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      status: { type: string, example: "ok" }
                      timestamp: { type: string, format: date-time }
                      database: { type: string, example: "connected" }

  /health/live:
    get:
      summary: Liveness probe
      tags: [System]
      responses:
        '200':
          description: Process liveness status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      status: { type: string, example: "alive" }
                      timestamp: { type: string, format: date-time }
                      uptimeSeconds: { type: integer, example: 42 }

  /health/ready:
    get:
      summary: Readiness probe
      tags: [System]
      responses:
        '200':
          description: System is ready to accept traffic
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      status: { type: string, example: "ready" }
                      timestamp: { type: string, format: date-time }
                      database: { type: string, example: "connected" }
        '503':
          description: System is unready (database unreachable)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: false }
                  data:
                    type: object
                    properties:
                      status: { type: string, example: "unready" }
                      timestamp: { type: string, format: date-time }
                      database: { type: string, example: "unreachable" }

  /auth/register:
    post:
      summary: User Registration / Sign Up
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, email, password]
              properties:
                firstName: { type: string, example: "John" }
                lastName: { type: string, example: "Doe" }
                email: { type: string, format: email, example: "user@example.com" }
                password: { type: string, example: "Secret123!" }
                phone: { type: string, example: "+1234567890" }
                gender: { type: string, enum: [male, female, other, prefer_not_to_say] }
                heightCm: { type: number, example: 178 }
                timezone: { type: string, example: "America/New_York" }
                locale: { type: string, example: "en" }
                deviceName: { type: string, example: "Pixel 8 Pro" }
      responses:
        '201':
          description: Registration successful and session created

  /auth/signup:
    post:
      summary: User Registration / Sign Up (Alias)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, email, password]
              properties:
                firstName: { type: string, example: "John" }
                lastName: { type: string, example: "Doe" }
                email: { type: string, format: email, example: "user@example.com" }
                password: { type: string, example: "Secret123!" }
                phone: { type: string, example: "+1234567890" }
                gender: { type: string, enum: [male, female, other, prefer_not_to_say] }
                heightCm: { type: number, example: 178 }
                timezone: { type: string, example: "America/New_York" }
                locale: { type: string, example: "en" }
                deviceName: { type: string, example: "Pixel 8 Pro" }
      responses:
        '201':
          description: Registration successful and session created

  /auth/login:
    post:
      summary: User / Admin Login
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: "user@example.com" }
                password: { type: string, example: "Secret123!" }
                deviceName: { type: string, example: "Pixel 8 Pro" }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'

  /auth/csrf:
    get:
      summary: Bootstrap CSRF protection token for web clients
      tags: [Auth]
      responses:
        '200':
          description: CSRF token issued in a readable cookie and response payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [csrfToken]
                    properties:
                      csrfToken: { type: string, minLength: 64, maxLength: 64 }

  /auth/refresh:
    post:
      summary: Refresh Access Token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: New access token and rotated refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'

  /auth/logout:
    post:
      summary: Revoke session
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: Logged out

  /auth/forgot-password:
    post:
      summary: Request an OTP password reset (compatibility alias)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: OTP challenge created

  /auth/request-password-reset:
    post:
      summary: Request an OTP password reset (compatibility alias)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: OTP challenge created

  /auth/reset-password:
    post:
      summary: Verify an OTP password reset (compatibility alias)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, otp, newPassword]
              properties:
                challengeId: { type: string }
                otp: { type: string, pattern: '^[0-9]{6}$' }
                newPassword: { type: string, minLength: 8 }
      responses:
        '200':
          description: Password reset successful

  /me:
    get:
      summary: Get current authenticated user profile
      tags: [Current User]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
    patch:
      summary: Update user profile
      tags: [Current User]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName: { type: string }
                lastName: { type: string }
                phone: { type: string }
                heightCm: { type: number }
                timezone: { type: string }
                locale: { type: string }
      responses:
        '200':
          description: Updated profile

  /me/settings:
    get:
      summary: Get notification and user settings
      tags: [Current User]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Settings data
    patch:
      summary: Update notification settings
      tags: [Current User]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                allowPush: { type: boolean }
                allowInApp: { type: boolean }
                allowReminders: { type: boolean }
                allowMissedTaskAlerts: { type: boolean }
      responses:
        '200':
          description: Updated settings

  /me/notification-settings:
    get:
      summary: Get notification preferences and quiet hours configuration
      tags: [Current User]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Notification settings and category preferences
    patch:
      summary: Update notification preferences and quiet hours configuration
      tags: [Current User]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pushEnabled: { type: boolean }
                inAppEnabled: { type: boolean }
                localNotificationsEnabled: { type: boolean }
                quietHoursEnabled: { type: boolean }
                quietHoursStart: { type: string, nullable: true }
                quietHoursEnd: { type: string, nullable: true }
                categories: { type: object, additionalProperties: { type: boolean } }
      responses:
        '200':
          description: Updated notification settings
    put:
      summary: Replace notification preferences and quiet hours configuration
      tags: [Current User]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pushEnabled: { type: boolean }
                inAppEnabled: { type: boolean }
                localNotificationsEnabled: { type: boolean }
                quietHoursEnabled: { type: boolean }
                quietHoursStart: { type: string, nullable: true }
                quietHoursEnd: { type: string, nullable: true }
                categories: { type: object, additionalProperties: { type: boolean } }
      responses:
        '200':
          description: Replaced notification settings

  /me/goals:
    get:
      summary: Get active user targets (weight goal, water target, cardio targets)
      tags: [Goals]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: User targets

  /me/today:
    get:
      summary: Resolve daily agenda and compliance tasks for today
      tags: [Daily Plan]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        '200':
          description: Resolved daily tasks and protocol targets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyPlanResponse'

  /me/days/{date}:
    get:
      summary: Resolve daily agenda for a specific historical or target date
      tags: [Daily Plan]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: date
          in: path
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Resolved agenda for date

  /me/weight:
    get:
      summary: Get current weight and target
      tags: [Weight]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        '200':
          description: Weight status
    post:
      summary: Log body weight
      tags: [Weight]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [weightKg]
              properties:
                weightKg: { type: number, minimum: 20, maximum: 500 }
                date: { type: string, format: date }
                notes: { type: string }
                clientOperationId: { type: string }
      responses:
        '200':
          description: Logged weight entry
    put:
      summary: Update/upsert body weight entry
      tags: [Weight]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [weightKg]
              properties:
                weightKg: { type: number, minimum: 20, maximum: 500 }
                date: { type: string, format: date }
                notes: { type: string }
                clientOperationId: { type: string }
      responses:
        '200':
          description: Logged weight entry

  /me/weight/history:
    get:
      summary: Get weight logging history and rolling averages
      tags: [Weight]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        '200':
          description: Weight history
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      currentWeightKg: { type: number, nullable: true }
                      rolling7DayAvg: { type: number, nullable: true }
                      rollingAverageKg: { type: number, nullable: true }
                      goal: { type: object, nullable: true }
                      entries:
                        type: array
                        items: { type: object }
                  pagination:
                    $ref: '#/components/schemas/Pagination'

  /me/water:
    post:
      summary: Log water intake
      tags: [Water]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountMl]
              properties:
                amountMl: { type: integer, minimum: 1, maximum: 10000 }
                date: { type: string, format: date }
                clientOperationId: { type: string }
      responses:
        '201':
          description: Water logged

  /me/water/today:
    get:
      summary: Get today water intake summary and entries
      tags: [Water]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Today water summary

  /me/water/history:
    get:
      summary: Get historical water logs
      tags: [Water]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 60 }
      responses:
        '200':
          description: Water history list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        intake_date: { type: string, format: date }
                        total_ml: { type: integer, example: 2500 }
                        amount_ml: { type: integer, example: 2500 }
                        entry_count: { type: integer, example: 3 }
                  pagination:
                    $ref: '#/components/schemas/Pagination'

  /me/water/{entryId}:
    delete:
      summary: Delete a logged water entry
      tags: [Water]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: entryId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Entry deleted

  /me/meals/today:
    get:
      summary: Get today diet meals with configured food options
      tags: [Meals]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Today meals

  /me/meals/history:
    get:
      summary: Get historical meal logs
      tags: [Meals]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Meal history
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { type: object }
                  pagination:
                    $ref: '#/components/schemas/Pagination'

  /me/meals/{mealId}/log:
    put:
      summary: Log/update meal completion with food option selections
      tags: [Meals]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: mealId
          in: path
          required: true
          schema: { type: integer }
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                logDate: { type: string, format: date }
                status: { type: string, enum: [completed, skipped, partial] }
                notes: { type: string }
                selections:
                  type: array
                  items:
                    type: object
                    required: [optionGroupId, optionId]
                    properties:
                      optionGroupId: { type: integer }
                      optionId: { type: integer }
                      foodId: { type: integer }
                      quantity: { type: number, exclusiveMinimum: 0 }
                clientOperationId: { type: string }
      responses:
        '200':
          description: Meal logged

  /me/workouts/start:
    post:
      summary: Start or resume workout session
      tags: [Workouts]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                workoutPlanDayId: { type: integer }
                sessionDate: { type: string, format: date }
                clientOperationId: { type: string }
      responses:
        '201':
          description: Workout session started
        '200':
          description: Existing workout session resumed

  /me/workouts/{sessionId}:
    get:
      summary: Get details and exercises of a workout session
      tags: [Workouts]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Workout session details

  /me/workouts/{sessionId}/sets:
    post:
      summary: Log workout set
      tags: [Workouts]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: integer }
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionExerciseId, setNumber]
              properties:
                sessionExerciseId: { type: integer }
                setNumber: { type: integer, minimum: 1 }
                setType: { type: string, enum: [warmup, working, dropset, failure] }
                weightKg: { type: number, minimum: 0, maximum: 1000 }
                reps: { type: integer, minimum: 1, maximum: 500 }
                durationSeconds: { type: integer }
                distanceMeters: { type: number }
                notes: { type: string }
                completed: { type: boolean }
                clientOperationId: { type: string }
      responses:
        '200':
          description: Set recorded

  /me/workouts/{sessionId}/complete:
    post:
      summary: Complete workout session
      tags: [Workouts]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: integer }
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes: { type: string }
                rating: { type: integer, minimum: 1, maximum: 5 }
                clientOperationId: { type: string }
      responses:
        '200':
          description: Workout marked completed

  /me/workouts/{sessionId}/skip:
    post:
      summary: Skip workout session
      tags: [Workouts]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: integer }
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes: { type: string }
                clientOperationId: { type: string }
      responses:
        '200':
          description: Workout marked skipped

  /me/exercises/{exerciseId}/previous-performance:
    get:
      summary: Get recent history and max weight for exercise
      tags: [Workouts]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: exerciseId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Historical performance data

  /exercises/metadata:
    get:
      summary: Get muscle groups and equipment types metadata (user accessible)
      tags: [Exercises]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Metadata lists

  /me/cardio:
    post:
      summary: Log cardio session
      tags: [Cardio]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cardioActivityId, durationMinutes]
              properties:
                cardioActivityId: { type: integer }
                cardioDate: { type: string, format: date }
                durationMinutes: { type: integer, minimum: 1, maximum: 1440 }
                distanceKm: { type: number }
                caloriesBurned: { type: integer }
                averageHeartRate: { type: integer }
                speedKmh: { type: number }
                inclinePct: { type: number }
                notes: { type: string }
                clientOperationId: { type: string }
      responses:
        '201':
          description: Cardio logged

  /me/cardio/activities:
    get:
      summary: List available cardio activities
      tags: [Cardio]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: List of cardio activities

  /me/cardio/history:
    get:
      summary: Get cardio session history
      tags: [Cardio]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Cardio history
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { type: object }
                  pagination:
                    $ref: '#/components/schemas/Pagination'

  /me/progress:
    get:
      summary: Get overall user progress and adherence metrics
      tags: [Progress]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Progress data

  /me/progress/workouts:
    get:
      summary: Get workout volume and completion progress
      tags: [Progress]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Workout progress

  /me/notifications:
    get:
      summary: Get user in-app notifications
      tags: [Notifications]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Notifications list

  /me/notifications/{id}/read:
    post:
      summary: Mark notification as read
      tags: [Notifications]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Marked as read

  /me/devices:
    post:
      summary: Register mobile push notification device
      tags: [Notifications]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceUuid, platform, pushToken]
              properties:
                deviceUuid: { type: string }
                platform: { type: string, enum: [ios, android] }
                pushToken: { type: string }
                appVersion: { type: string }
      responses:
        '200':
          description: Push device registered

  /foods:
    get:
      summary: Search and list food items (user accessible)
      tags: [Foods]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: search
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Food items list

  /admin/users:
    get:
      summary: List platform users
      tags: [Admin, Users]
      security: [{ bearerAuth: [] }]
