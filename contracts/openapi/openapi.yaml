      summary: Delete an owned plan exercise
      responses:
        '200': { description: Plan exercise deleted }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Pagination:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }

    AuthSessionResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/User'
            accessToken: { type: string }
            refreshToken: { type: string }
            expiresInSeconds: { type: integer, example: 900 }

    User:
      type: object
      properties:
        id: { type: integer }
        role: { type: string, example: "user" }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        timezone: { type: string }
        locale: { type: string }
        status: { type: string }

    UserProfileResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/User'
            heightCm: { type: number }
            currentWeightKg: { type: number }
            targetWeightKg: { type: number }
            dietPlan: { type: object }
            workoutPlan: { type: object }

    DailyPlanResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            date: { type: string, format: date }
            timezone: { type: string }
            tasks:
              type: array
              items:
                type: object
                properties:
                  id: { type: integer }
                  taskType: { type: string }
                  taskKey: { type: string }
                  title: { type: string }
                  status: { type: string }
                  isCompleted: { type: boolean }
            weight: { type: object }
            water: { type: object }
            diet: { type: object }
            workout: { type: object }
            cardio: { type: object }
            summary:
              type: object
              properties:
                completedTasks: { type: integer }
                totalTasks: { type: integer }
                overallAdherencePct: { type: number }
